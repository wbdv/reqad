; What the apache_modphp template means for the panel. Read by web_caps() in
; public_html/modules/functions.php and by scripts/web_caps.sh.
;   front   = nginx | httpd   the server on :80/:443 (vhosts, certificates, SNI)
;   backend = none  | httpd   a second server behind the front, on 127.0.0.1 only
;   php     = fpm   | modphp  modphp: mod_php is the default handler, php-fpm optional per account
front=httpd
backend=none
php=modphp
