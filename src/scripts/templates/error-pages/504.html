<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Taking too long</title>
<!-- Generic error page shared by every site on this server (no server name on purpose).
     Source: /usr/local/reqad/scripts/templates/error-pages/ -->
<style>
:root{--bg:#f6f8fb;--fg:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#206bc4}
@media (prefers-color-scheme:dark){:root{--bg:#111827;--fg:#f3f4f6;--muted:#9ca3af;--line:#374151;--accent:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding:24px}
main{max-width:440px;text-align:center}
.code{font-size:72px;font-weight:700;letter-spacing:-2px;line-height:1;color:var(--muted);opacity:.55}
h1{font-size:22px;margin:18px 0 8px}
p{color:var(--muted);margin:0 0 26px;line-height:1.5}
a{display:inline-block;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:8px 16px}
a:hover{border-color:var(--accent)}
</style>
</head>
<body>
<main>
<div class="code">504</div>
<h1>Taking too long</h1>
<p>The site took too long to answer. Please try again in a few minutes.</p>
<a href="/">Go to the homepage</a>
</main>
</body>
</html>
