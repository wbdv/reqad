; ---------------------------------------------------------------------------
; Reqad -- skip-RBL ESP catalogue
;
; Well-known email service providers whose sending ranges should never be
; rejected on the strength of a DNS blocklist hit. scripts/mail/build-skiprbl.sh
; walks the SPF records named here and writes the addresses to
; /etc/exim/skiprblhosts, grouped under a comment naming the provider.
;
; One section per provider. The section name is the key stored in the panel
; (settings: skiprbl-disabled), so renaming a section re-enables it.
;
;   label   human name shown in the panel and written into the generated file
;   spf     comma-separated seed domains; their SPF records are walked
;   follow  no = take only the ip4:/ip6: of the seed itself, do not descend
;           into include:/redirect= (use when a provider's SPF pulls in other
;           providers, which would file their ranges under the wrong name)
;   static  space-separated addresses added verbatim, for ranges a provider
;           still sends from but no longer publishes in SPF
;   default off = ship this provider switched OFF. For senders worth having
;           catalogued but not exempted -- a known spam source, or bulk mail you
;           would rather keep judging on blocklist hits. An explicit choice in
;           the panel always wins; `default` only decides for a provider nobody
;           has chosen either way, so one added by a later update stays off
;           instead of being switched on by settings saved before it existed.
;   sa_score  SpamAssassin score for mail handed over directly by this provider
;           (rule REQAD_ESP_<KEY> in /etc/mail/spamassassin/reqad-esp.cf).
;           A small offset, not a whitelist: every one of these platforms also
;           carries spam, so the bonus only tips borderline legitimate mail.
;           Allowed range -3..0; missing means 0. A 0 still writes the rule at
;           -0.001 so hits show up in X-Spam-Report without moving the score.
;             -1.0  sends only its own notifications (nobody else can use it)
;             -0.5  mailbox or transactional service with strict abuse control
;             -0.2..-0.3  platforms where paying or free customers send too
;              0    self-serve bulk senders with heavy abuse (and anything
;                   switched off by default)
;
; Deliberately absent: SparkPost and Salesforce publish `exists:%{i}...` SPF,
; which answers per-query and cannot be enumerated into a list at all.
; ---------------------------------------------------------------------------

[google]
label = Google / Gmail / Workspace
sa_score = -0.5
spf = _spf.google.com
; Ranges the provider still sends from but no longer advertises in SPF. They
; came off the hand-maintained list this file replaced; dropping them would
; have changed who gets exempted, so they are kept and attributed instead.
